# pytest-board configuration: library headlines and execution machines
# -----------------------------------------------------------------------------
# Copy this file to <your --root>/pytest-board.ini (or pass --groups /path/file.ini).
# Save the file and the board picks up changes within a few seconds (no restart).
#
# ── Headlines ── every plain [SECTION] is one headline in the test library, in this order.
# All keys are optional:
#   title    short description shown under the headline
#   color    headline colour, e.g. #3b5bdb (a default palette is used otherwise)
#   dir      folder the headline's tests run in, relative to the project root
#            (on this server: --root; on a machine: its workdir)
#   machine  default machine for this headline's tests (a [machine:NAME] below, one added in
#            the UI, or "local"). A test or card can still pick its own machine.
#   branch   git branch to test by default, e.g. main: before pytest starts, the project folder
#            (a machine's workdir, or --root here) is switched to the latest version of it
#            (git fetch + checkout). A test or card can set its own branch.
#   args     pytest arguments added in front of each test's own args
#   env      KEY=value lines, one per line. A test's own env overrides these.
#            Values stay on the server; the browser only ever sees the key names.
#   env_file a .env file on this server (export NAME=value lines) for this headline's tests,
#            relative to this file's folder. Its values come just before this headline's env.
#   tests    starter tests to put in the library, one per line:
#              target                      e.g. test_api.py  or  tests/x.py::test_y
#              name | target               e.g. Health check | test_api.py::test_health
#              name | target | args        e.g. Slow suite | . | -m slow
#              name | target | args | machine
#                                          e.g. Nightly | test_nightly.py | -q | lab-a
#            (leave args empty to skip it:  Smoke | test_smoke.py | | lab-a)
#            Each line is added once. If you delete that test in the UI it stays deleted.
#   options  option sets offered when a test of this headline is put on the board, one per line:
#              args                        e.g. -x
#              label | args                e.g. Smoke only | -m smoke
#            The board asks which ones to use (tick any number) and makes one card; its runs get
#            the ticked args added to the pytest command. Options your tests define (like --device=A) need a
#            pytest_addoption() in conftest.py. A ';' starts a comment, so it can't be part of an option set.
#
# ── Machines ── every [machine:NAME] section is a Linux host reached with ssh.
#   host         hostname, IP, or a Host alias from ~/.ssh/config          (required)
#   user         ssh user (default: from ~/.ssh/config, else the service user)
#   port         ssh port (default 22)
#   identity     private key file on THIS server, e.g. ~/.ssh/pytest_board_ed25519
#   workdir      project folder on the machine (default: ~/git; ~ = the user's home folder)
#   python       how to start pytest there (default: python3 -m pytest),
#                e.g. .venv/bin/python -m pytest  (relative to workdir + headline dir)
#   slots        how many runs may execute on it at once (default 1)
#   sync         yes = rsync the project (--root) to workdir before every run (needs rsync
#                on both ends); no = the project is already checked out there (default)
#   env          KEY=value lines for every run on this machine (headline/test env win)
#   env_file     a .env file on THIS server for every run on this machine (comes before env)
#   remote_env_file
#                a .env file ON THE MACHINE, loaded there before each run if it exists
#                (default: .env in workdir; a path relative to workdir, ~/…, or none to turn it off)
#   ssh_options  extra ssh arguments, e.g. -o ProxyJump=bastion.example.com
#   notes        free text shown in the UI
# Login must be key-based (the board runs ssh with BatchMode=yes and never asks for passwords).
#
# A .env file next to this one applies to every run (see the README, "Environment variables and
# .env files"). Most specific wins: .env < machine's own .env < machine env_file < machine env
# < headline env_file < headline env < the test's own env.
#
# Each run also gets PYTEST_BOARD_RUN_ID, PYTEST_BOARD_GROUP (headline) and, on a machine,
# PYTEST_BOARD_MACHINE in its environment.

[TEST_SYSTEM]
title   = System under test
dir     = tests
machine = lab-a
args    = -ra
env     =
    BASE_URL=https://system.staging.example.com
# env_file = secrets/test_system.env
# branch  = main
tests   =
    All tests | .
    Health check | test_api.py::test_health
options =
    Smoke only | -m smoke
    Slow tests | -m slow --maxfail=3
    Stop at first failure | -x
    Only last failures | --lf

[machine:lab-a]
host     = 10.0.4.21
user     = tester
identity = ~/.ssh/pytest_board_ed25519
workdir  = ~/git
python   = .venv/bin/python -m pytest
slots    = 2
notes    = Ubuntu 24.04, 16 cores
# optional, see the key list above:
# sync        = yes
# ssh_options = -o ProxyJump=bastion.example.com
# env_file    = secrets/lab-a.env
# remote_env_file = .env
# env         =
#     DISPLAY=:99
